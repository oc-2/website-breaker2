name: Update website-breaker submodule

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [website-breaker-updated]

concurrency:
  group: update-submodule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    # Adjust timeout based on how long this job usually takes. Default is 360.
    timeout-minutes: 360

    # Only run repository_dispatch events that target the tracked ref/branch.
    # Allow workflow_dispatch and schedule to run without a client_payload check.
    if: >
      github.event_name != 'repository_dispatch'
      || (github.event_name == 'repository_dispatch' && github.event.client_payload.ref == 'refs/heads/main')

    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: Sync and update website-breaker submodule to latest remote commit
        run: |
          echo "Updating website-breaker submodule..."
          git submodule sync --recursive
          git submodule update --init --remote --recursive
          git add website-breaker

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update website-breaker submodule to latest commit"
            git push origin HEAD
            echo "✅ Submodule updated and pushed."
          else
            echo "✔ Submodule already up to date."
          fi
